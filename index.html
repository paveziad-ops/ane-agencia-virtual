<style data-ane-property-layout-fix="1">
/* Agencia Virtual - ajustes responsivos da pagina Meus Imoveis. */
/* Sair ja permanece disponivel no cabecalho autenticado. */
#app .content-wrap .page-header > button[onclick*="logOut"] { display: none !important; }
@media (max-width: 770px) {
  #app main.container.content-wrap[style*="max-width:850px"] {
    box-sizing: border-box; width: calc(100% - 30px) !important;
    max-width: 600px !important; min-width: 0; margin-inline: auto; overflow-x: clip;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .page-header,
  #app main.container.content-wrap[style*="max-width:850px"] .page-header > div,
  #app main.container.content-wrap[style*="max-width:850px"] .property-search,
  #app main.container.content-wrap[style*="max-width:850px"] .property-list,
  #app main.container.content-wrap[style*="max-width:850px"] .banner-demo {
    min-width: 0; max-width: 100%;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .page-header h1,
  #app main.container.content-wrap[style*="max-width:850px"] .banner-demo {
    overflow-wrap: anywhere;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .property-search input {
    min-width: 0; max-width: 100%; font-size: 16px !important;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .property-search > button {
    max-width: 100%; min-width: 0;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .tabs-inline {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px; width: 100%; min-width: 0; max-width: 100%;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .tabs-inline > button {
    min-width: 0; max-width: 100%; padding: 10px 5px;
    font-size: 11px; white-space: normal; overflow-wrap: anywhere; line-height: 1.35;
  }
  #app main.container.content-wrap[style*="max-width:850px"] .property,
  #app main.container.content-wrap[style*="max-width:850px"] .property-desc {
    min-width: 0; max-width: 100%; overflow-wrap: anywhere;
  }
}
</style><link rel="stylesheet" href="/ios-autofill-stability.css">
<link rel="stylesheet" href="/brand-oficial.css">

<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>

<script defer src="/bridge-invoice-payment-fix.js"></script>
<script>
(function(){
function showLabels(){var root=document.getElementById('app');if(!root)return;root.querySelectorAll('.consumption-bars .bar').forEach(function(bar){var label=(bar.getAttribute('title')||'').split(':').slice(1).join(':').trim();if(label && bar.dataset.value!==label)bar.dataset.value=label;})}
function start(){var root=document.getElementById('app');if(!root)return;showLabels();new MutationObserver(showLabels).observe(root,{childList:true,subtree:true});window.addEventListener('hashchange',showLabels)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script><script defer src="/email-quick.js"></script>
<script defer src="/bridge-confirmacao-fatura.js"></script>

<script defer src="/ios-autofill-stability.js"></script>
