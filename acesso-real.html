<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4696"><meta name="robots" content="noindex,nofollow">
<title>ANE • Agência Virtual | Homologação</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.consumption-bars{height:190px;padding-top:26px;overflow:visible}
.consumption-bars .bar::before{content:attr(data-value);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:clamp(9px,2.7vw,12px);font-weight:800;color:#1d4696;white-space:nowrap;pointer-events:none;line-height:1.15}
</style></head><body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script defer src="/app.js"></script>
<script defer src="/bridge-auth.js"></script>
<script defer src="/bridge-data.js"></script>
<script defer src="/bridge-lookup.js"></script>
<script>
(function(){
function showLabels(){var root=document.getElementById('app');if(!root)return;root.querySelectorAll('.consumption-bars .bar').forEach(function(bar){var label=(bar.getAttribute('title')||'').split(':').slice(1).join(':').trim();if(label && bar.dataset.value!==label)bar.dataset.value=label;})}
function start(){var root=document.getElementById('app');if(!root)return;showLabels();new MutationObserver(showLabels).observe(root,{childList:true,subtree:true});window.addEventListener('hashchange',showLabels)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
